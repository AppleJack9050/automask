services:
  image-processor:
    container_name: image-processor
    build:
      context: ./image-processor
      dockerfile: Dockerfile
    environment:
      - SAM2_FULL_PATH=/image-processor/Grounded-SAM-2/sam2
      - SAM2_CHECKPOINT=checkpoints/sam2.1_hiera_large.pt
      - SAM2_CONFIG=configs/sam2.1/sam2.1_hiera_l.yaml
      - SAM3_FULL_PATH=/image-processor/sam3
      - GROUNDING_DINO_CHECKPOINT=/image-processor/Grounded-SAM-2/gdino_checkpoints/groundingdino_swint_ogc.pth
      - GROUNDING_DINO_CONFIG=/image-processor/Grounded-SAM-2/grounding_dino/groundingdino/config/GroundingDINO_SwinT_OGC.py
      - RABBITMQ_HOST=rabbitmq
      - USER_DB=/data/user.db
      - IMAGE_DB=/data/query.db
      - SAVED_DIR=/saved
      - UPLOAD_DIR=/uploads
      - PROCESSED_DIR=/processed
      - USERS_DB=/database/users.db
      - FILES_DB=/database/files.db
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    volumes:
      - uploads:/uploads
      - processed:/processed
      - saved:/saved
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
  api:
    container_name: api
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
      - USER_DB=/data/user.db
      - IMAGE_DB=/data/query.db
      - SAVED_DIR=/saved
      - UPLOAD_DIR=/uploads
      - PROCESSED_DIR=/processed
      - USERS_DB=/database/users.db
      - FILES_DB=/database/files.db
    volumes:
      - uploads:/uploads
      - processed:/processed
      - saved:/saved
      - database:/database
    ports:
      - "8000:80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      rabbitmq:
        condition: service_healthy
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - app-network
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
  processed:
  saved:
  database:
