services:
  automask-api:
    container_name: api
    user: "${UID}:${GID}"
    build:
      context: ./api
      dockerfile: Dockerfile
#    image: mbyrne01/automask:automask-automask-api
    environment:
      - SAM2_FULL_PATH=/api/Grounded-SAM-2/sam2
      - SAM2_CHECKPOINT=checkpoints/sam2.1_hiera_large.pt
      - SAM2_CONFIG=configs/sam2.1/sam2.1_hiera_l.yaml
      - SAM3_FULL_PATH=/api/sam3
      - GROUNDING_DINO_CHECKPOINT=/api/Grounded-SAM-2/gdino_checkpoints/groundingdino_swint_ogc.pth
      - GROUNDING_DINO_CONFIG=/api/Grounded-SAM-2/grounding_dino/groundingdino/config/GroundingDINO_SwinT_OGC.py
    volumes:
      - uploads:/api/uploads
      - processed:/api/processed
      - saved:/api/saved
    ports:
      - "8000:80"
    networks:
      - app-network

  automask-frontend:
    container_name: frontend
    build:
      context: ./automask-frontend
      dockerfile: Dockerfile
#    image: mbyrne01/automask:automask-automask-frontend
    ports:
      - "8080:80"
    networks:
      - app-network
  ### TODO: impliment healthchecks later 

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
  processed:
  saved:
